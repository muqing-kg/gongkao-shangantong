<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同舟共济 · 一起渡过这段路</title>
<meta name="description" content="同舟共济 — 公务员考试学习与成长平台：行测研习、申论书房、错题温习、模考组卷、能力分析与上岸小助手学习助手。纯前端离线可用，学习数据保存在本地。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#F8EFE2">
<link rel="stylesheet" href="css/style.css?v=2.6.3">
<link rel="stylesheet" href="css/ai.css?v=1.0.1">
</head>
<body>
<div id="app" class="app-shell">
  <aside class="sidebar" aria-label="同舟共济主导航">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true"><img src="assets/illus/logo-boat.png" alt=""></span>
      <span class="brand-name"><strong>同舟共济</strong><em>一起渡过这段路</em></span>
    </div>
    <nav class="tabbar" aria-label="主要功能">
      <button class="tab active" data-view="dashboard" aria-current="page"><svg class="tab-ico" aria-hidden="true"><use href="#i-home"></use></svg>首页</button>
      <button class="tab" data-view="practice"><svg class="tab-ico" aria-hidden="true"><use href="#i-book"></use></svg>行测</button>
      <button class="tab" data-view="shenlun"><svg class="tab-ico" aria-hidden="true"><use href="#i-pen"></use></svg>申论</button>
      <button class="tab" data-view="growth"><svg class="tab-ico" aria-hidden="true"><use href="#i-trendUp"></use></svg>成长</button>
      <button class="tab ask-tab" data-view="ai"><svg class="tab-ico" aria-hidden="true"><use href="#i-spark"></use></svg>上岸小助手</button>
    </nav>
    <div class="sidebar-motto"><q>一起渡过这段路</q><small>静心研习，日日精进</small></div>
  </aside>

  <section class="main-shell">
    <header class="topbar">
      <div class="mobile-brand" aria-label="同舟共济">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="15" fill="#17384c"/><path d="M16 20 Q32 13 48 20" fill="none" stroke="#f5eedf" stroke-width="3.5" stroke-linecap="round"/><path d="M18 25 Q25 24 31 29 V43 Q25 38 18 39Z M46 25 Q39 24 33 29 V43 Q39 38 46 39Z" fill="#f5eedf"/><path d="M17 47 Q32 42 47 47 M21 52 Q32 48 43 52" fill="none" stroke="#b58a4b" stroke-width="2.5"/></svg>
        <span>同舟共济</span>
      </div>
      <div class="top-actions">
        <span id="streakBadge" class="streak-badge" title="连续打卡天数">连续学习 <b>0</b> 天</span>
        <button type="button" class="top-ask" data-open-view="ai">✦ 上岸小助手</button>
      </div>
      <div id="bankProgress" class="bank-progress hidden" title="完整题库加载进度" role="status" aria-live="polite"><i></i><span></span></div>
    </header>

    <main id="view" class="view"></main>
  </section>
</div>

<!-- 答题弹层 -->
<div id="quizLayer" class="quiz-layer hidden" role="dialog" aria-modal="true" aria-labelledby="quizTitle" tabindex="-1">
  <div class="quiz-head">
    <div class="quiz-title" id="quizTitle">刷题</div>
    <div class="quiz-meta">
      <span id="quizProgress">1/10</span>
      <span id="quizTimer" class="timer-chip">00:00</span>
      <button id="quizClose" class="icon-btn" title="退出" aria-label="退出答题">✕</button>
    </div>
  </div>
  <div class="quiz-body" id="quizBody"></div>
  <div class="quiz-foot" id="quizFoot">
    <button class="btn" id="footPrev" onclick="prevQ()">上一题</button>
    <button class="btn" id="footMark" onclick="markQ()">⚑ 标记</button>
    <button class="btn primary" id="footNext" onclick="nextQ()">下一题</button>
  </div>
</div>

<!-- 结果弹层 -->
<div id="resultLayer" class="quiz-layer hidden" role="dialog" aria-modal="true" aria-label="答题结果" tabindex="-1">
  <div class="result-box" id="resultBox"></div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="js/questions.js"></script>
<script src="js/icons.js?v=2.6.3"></script>
<script src="js/lazy-bank.js?v=2.6.3"></script>
<script src="js/shenlun.js?v=2.6.3"></script>
<script src="js/ai.js?v=2.6.3"></script>
<script src="js/app.js?v=2.6.3"></script>
<script src="js/sync.js?v=2.6.3"></script>
<script src="js/easter.js?v=1.0.0" defer></script>
<!--
  给翻到这儿的人：

  这个站是给一个人做的。她在准备省考，行测做不完，正确率上不去。
  所以我写了这套东西——题库、错题本、申论批改、还有一个能陪她说话的小助手。

  如果你也翻到了这里，说明你和她一样，都爱刨根问底。
  源码里还藏了几处，慢慢找：
    · 连点左上角那只小船七下
    · 在页面上按住 Shift 点一下空白处
    · 在键盘上敲 z h o u
    · 长按首页右上角的「连续学习」徽章两秒
    · 深夜（23 点后）打开首页

  同舟共济，一起渡过这段路。
-->
</body>
</html>
