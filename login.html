<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>同舟共济 · 登录</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#F8EFE2">
<style>
:root{
  --paper:#F8EFE2;--card:#FDF8EE;--line:#EADDC9;
  --clay:#C08468;--clay-2:#DBAE9A;--clay-soft:#F7E4DA;
  --ink:#4A3B2E;--ink-2:#8A7461;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);background:var(--paper);
  background-image:
    radial-gradient(58% 26% at 88% 0%,rgba(243,199,174,.45),transparent 70%),
    radial-gradient(52% 24% at 0% 14%,rgba(240,214,190,.40),transparent 72%);
  background-attachment:fixed;
  display:grid;place-items:center;padding:24px;
}
.card{
  width:100%;max-width:372px;background:var(--card);border:1px solid var(--line);
  border-radius:26px;padding:38px 30px 30px;text-align:center;
  box-shadow:0 18px 50px rgba(147,107,86,.13);
}
.logo{width:96px;height:96px;margin:0 auto 14px;display:block}
h1{font-family:"STKaiti","KaiTi","Noto Serif SC",serif;font-size:26px;letter-spacing:3px;margin:0 0 6px;color:#3F3025}
.sub{margin:0 0 28px;color:var(--ink-2);font-size:13.5px;letter-spacing:.5px}
label{display:block;text-align:left;font-size:12.5px;color:var(--ink-2);margin:0 0 7px 3px}
input[type=password]{
  /* 有些移动端浏览器会给密码框套上原生外观（自带小黑框、宽度塌陷），
     这里逐项按死：block + 100% 宽 + 关掉原生 appearance + 16px 防 iOS 缩放 */
  display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;
  height:50px;padding:0 15px;font-size:16px;line-height:50px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:13px;outline:none;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  transition:border-color .16s,box-shadow .16s;
}
input[type=password]::-webkit-credentials-auto-fill-button,
input[type=password]::-webkit-contacts-auto-fill-button{
  /* 隐藏 Safari 的自动填充图标，它会把输入框挤窄 */
  visibility:hidden;display:none!important;pointer-events:none;position:absolute;right:0;
}
input[type=password]:focus{border-color:var(--clay-2);box-shadow:0 0 0 3px rgba(219,174,154,.28)}
button{
  width:100%;height:50px;margin-top:18px;border:0;border-radius:13px;cursor:pointer;
  font-size:15.5px;font-weight:600;letter-spacing:1px;color:#fff;
  background:linear-gradient(145deg,var(--clay-2),var(--clay));
  box-shadow:0 6px 18px rgba(192,132,104,.28);
  transition:transform .12s,box-shadow .16s,opacity .16s;
}
button:hover{box-shadow:0 8px 24px rgba(192,132,104,.34)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:14px;font-size:13px;color:#C9553F}
.msg.ok{color:#6E7F52}
@media(max-width:400px){.card{padding:30px 22px 24px;border-radius:22px}.logo{width:80px;height:80px}}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo-mark.png" alt="">
  <h1>同舟共济</h1>
  <p class="sub">一起渡过这段路</p>

  <form id="form" autocomplete="off">
    <label for="pw">访问密码</label>
    <input id="pw" type="password" name="password" autocomplete="current-password"
           placeholder="请输入密码" required autofocus>
    <button id="go" type="submit">进入</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const form = $('#form'), pw = $('#pw'), go = $('#go'), msg = $('#msg');

/* 已登录就直接跳走 */
fetch('api/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.role) location.replace(d.role === 'admin' ? 'admin.html' : 'index.html'); })
  .catch(() => {});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const password = pw.value;
  if (!password) return;
  go.disabled = true; msg.className = 'msg'; msg.textContent = '正在验证…';
  try {
    const r = await fetch('api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ password }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      msg.textContent = d.error || '登录失败';
      pw.select();
      go.disabled = false;
      return;
    }
    msg.className = 'msg ok';
    msg.textContent = d.role === 'admin' ? '管理员，正在进入后台…' : '欢迎回来，正在进入…';
    location.replace(d.role === 'admin' ? 'admin.html' : 'index.html');
  } catch (err) {
    msg.textContent = '连不上服务器，请确认服务已启动';
    go.disabled = false;
  }
});
</script>
</body>
</html>
